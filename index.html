<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Our Journey</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg: #b4e1ee;
            --card: #ffffff;
            --accent: #0f6295;
            --accent2: #85b2d7;
            --soft: #fde8e0;
            --text: #2a1a14;
            --muted: #87b0d6;
            --shadow: 0 8px 40px rgba(232, 101, 74, 0.10);
            --radius: 18px;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 48px 16px 80px;
            position: relative;
            overflow-x: hidden;
        }

        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.18;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            width: 520px;
            height: 520px;
            background: var(--accent);
            top: -120px;
            right: -160px;
        }

        body::after {
            width: 400px;
            height: 400px;
            background: #f5c0a8;
            bottom: -100px;
            left: -100px;
        }

        .container {
            max-width: 860px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 52px;
            animation: fadeUp 0.7s ease both;
        }

        .heart-row {
            font-size: 1.8rem;
            letter-spacing: 8px;
            margin-bottom: 12px;
            animation: pulse 2.5s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1)
            }

            50% {
                transform: scale(1.08)
            }
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 6vw, 3.4rem);
            font-weight: 700;
            line-height: 1.15;
            margin-bottom: 10px;
        }

        h1 em {
            font-style: italic;
            color: var(--accent);
        }

        .subtitle {
            font-size: 1rem;
            color: var(--muted);
            font-weight: 300;
            letter-spacing: 0.04em;
        }

        /* Love counter */
        .love-counter {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 28px 24px;
            margin-bottom: 40px;
            text-align: center;
            animation: fadeUp 0.7s 0.12s ease both;
        }

        .lc-label {
            font-size: 3rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 6px;
        }

        .lc-days {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.8rem, 8vw, 4.2rem);
            font-weight: 700;
            color: var(--accent);
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .lc-days-unit {
            font-size: 1rem;
            color: var(--muted);
            margin: 2px 0 16px;
        }

        .lc-grid {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .lc-unit {
            background: var(--soft);
            border-radius: 12px;
            padding: 12px 18px;
            min-width: 72px;
        }

        .lc-num {
            font-size: 1.7rem;
            font-weight: 700;
            color: var(--text);
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }

        .lc-unit-label {
            font-size: 0.7rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-top: 4px;
        }

        .lc-since {
            font-size: 0.78rem;
            color: var(--muted);
            margin-top: 14px;
        }

        /* ===== TAB TOGGLE ===== */
        .view-toggle {
            display: flex;
            gap: 0;
            background: var(--card);
            border-radius: 14px;
            box-shadow: var(--shadow);
            padding: 6px;
            margin-bottom: 24px;
            animation: fadeUp 0.7s 0.2s ease both;
            width: fit-content;
        }

        .view-toggle-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 11px 24px;
            border: none;
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            background: transparent;
            color: var(--muted);
            transition: all 0.25s cubic-bezier(.4, 0, .2, 1);
            white-space: nowrap;
        }

        .view-toggle-btn .btn-icon {
            font-size: 1.05rem;
            transition: transform 0.25s;
        }

        .view-toggle-btn:hover {
            color: var(--accent);
        }

        .view-toggle-btn.active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 16px rgba(15, 98, 149, 0.30);
        }

        .view-toggle-btn.active .btn-icon {
            transform: scale(1.15);
        }

        /* ===== VIEW PANELS ===== */
        .view-panel {
            display: none;
            animation: fadeUp 0.4s ease both;
        }

        .view-panel.active {
            display: block;
        }

        /* ===== MAP SECTION ===== */
        .map-section-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text);
        }

        .map-section-title em {
            color: var(--accent);
            font-style: italic;
        }

        .map-section-sub {
            font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 18px;
        }

        .map-wrapper {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        #hanoi-map {
            width: 100%;
            height: 460px;
        }

        /* ===== CHECK-IN LIST ===== */
        .checkin-header {
            margin-bottom: 18px;
        }

        .checkin-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
        }

        .checkin-title em {
            color: var(--accent);
            font-style: italic;
        }

        .checkin-sub {
            font-size: 0.85rem;
            color: var(--muted);
        }

        .checkin-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .checkin-item {
            background: var(--card);
            border-radius: 14px;
            box-shadow: var(--shadow);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            transition: transform 0.18s, box-shadow 0.18s;
            border: 2px solid transparent;
        }

        .checkin-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 40px rgba(15, 98, 149, 0.14);
            border-color: var(--accent2);
        }

        .checkin-item-icon {
            font-size: 1.8rem;
            flex-shrink: 0;
            width: 48px;
            height: 48px;
            background: var(--soft);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .checkin-item-info {
            flex: 1;
            min-width: 0;
        }

        .checkin-item-name {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text);
            margin-bottom: 2px;
        }

        .checkin-item-desc {
            font-size: 0.82rem;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .checkin-item-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
            flex-shrink: 0;
        }

        .checkin-photo-count {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.78rem;
            color: var(--accent);
            font-weight: 500;
            background: rgba(15, 98, 149, 0.08);
            padding: 3px 10px;
            border-radius: 999px;
        }

        .checkin-arrow {
            font-size: 0.85rem;
            color: var(--muted);
        }

        .checkin-empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .checkin-empty .empty-icon {
            font-size: 3rem;
            margin-bottom: 12px;
        }

        /* Map popup */
        .map-popup-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(20, 10, 8, 0.80);
            z-index: 400;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(6px);
        }

        .map-popup-overlay.open {
            display: flex;
        }

        .map-popup-box {
            background: var(--card);
            border-radius: 24px;
            max-width: 680px;
            width: 100%;
            max-height: 88vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            animation: popIn 0.35s cubic-bezier(.34, 1.56, .64, 1) both;
            box-shadow: 0 32px 100px rgba(232, 101, 74, 0.28);
        }

        @keyframes popIn {
            from {
                transform: scale(0.82);
                opacity: 0
            }

            to {
                transform: scale(1);
                opacity: 1
            }
        }

        .map-popup-header {
            padding: 20px 24px 14px;
            border-bottom: 1px solid #f3e8e0;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-shrink: 0;
        }

        .map-popup-icon {
            font-size: 1.5rem;
            margin-bottom: 2px;
        }

        .map-popup-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            color: var(--text);
            line-height: 1.3;
        }

        .map-popup-desc {
            font-size: 0.8rem;
            color: var(--muted);
            margin-top: 2px;
        }

        .map-popup-close {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: var(--muted);
            padding: 2px 8px;
            border-radius: 6px;
            transition: background 0.15s;
            flex-shrink: 0;
        }

        .map-popup-close:hover {
            background: var(--soft);
        }

        .map-popup-body {
            overflow-y: auto;
            padding: 20px 24px 24px;
            flex: 1;
        }

        .map-photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 10px;
        }

        .map-photo-item {
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 1/1;
            background: var(--soft);
            cursor: zoom-in;
            position: relative;
        }

        .map-photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
            display: block;
        }

        .map-photo-item:hover img {
            transform: scale(1.06);
        }

        .map-photo-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: var(--muted);
            font-size: 0.78rem;
            text-align: center;
            padding: 12px;
        }

        .map-photo-placeholder .ph-icon {
            font-size: 2rem;
        }

        .map-photo-placeholder code {
            background: #f3e8e0;
            padding: 2px 7px;
            border-radius: 5px;
            font-size: 0.72rem;
            color: var(--accent);
            word-break: break-all;
        }

        .map-viewer {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(10, 5, 4, 0.96);
            z-index: 500;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .map-viewer.open {
            display: flex;
        }

        .map-viewer img {
            max-width: 92vw;
            max-height: 82vh;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            object-fit: contain;
        }

        .map-viewer-close {
            position: absolute;
            top: 20px;
            right: 24px;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: #fff;
            font-size: 1.6rem;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .map-viewer-close:hover {
            background: rgba(255, 255, 255, 0.28);
        }

        /* Custom pin markers */
        .custom-pin {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            background: var(--accent);
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            box-shadow: 0 4px 14px rgba(232, 101, 74, 0.45);
            border: 3px solid #fff;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .custom-pin:hover {
            transform: rotate(-45deg) scale(1.15);
            box-shadow: 0 6px 20px rgba(232, 101, 74, 0.6);
        }

        .custom-pin-inner {
            transform: rotate(45deg);
            font-size: 1rem;
            line-height: 1;
        }

        footer {
            text-align: center;
            margin-top: 52px;
            font-size: 0.82rem;
            color: var(--muted);
            animation: fadeUp 0.7s 0.6s ease both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(22px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        @media (max-width: 640px) {
            #hanoi-map {
                height: 320px;
            }

            .view-toggle {
                width: 100%;
            }

            .view-toggle-btn {
                flex: 1;
                justify-content: center;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <!-- LOVE COUNTER -->
        <div class="love-counter">
            <div class="lc-label">🐴 &nbsp; LUV &nbsp; ✈️</div>
            <div class="lc-days" id="lcDays">0</div>
            <div class="lc-days-unit">Days</div>
            <div class="lc-grid">
                <div class="lc-unit">
                    <div class="lc-num" id="lcH">00</div>
                    <div class="lc-unit-label">Hours</div>
                </div>
                <div class="lc-unit">
                    <div class="lc-num" id="lcM">00</div>
                    <div class="lc-unit-label">Minutes</div>
                </div>
                <div class="lc-unit">
                    <div class="lc-num" id="lcS">00</div>
                    <div class="lc-unit-label">Seconds</div>
                </div>
                <div class="lc-unit">
                    <div class="lc-num" id="lcMs">00</div>
                    <div class="lc-unit-label">Milli</div>
                </div>
            </div>
            <div class="lc-since">💕 Since 06/02/2026</div>
        </div>

        <!-- TAB TOGGLE BUTTONS -->
        <div class="view-toggle">
            <button class="view-toggle-btn active" id="btnMap" onclick="switchView('map')">
                <span class="btn-icon">🗺️</span> Our Map
            </button>
            <button class="view-toggle-btn" id="btnList" onclick="switchView('list')">
                <span class="btn-icon">📋</span> Check-in List
            </button>
        </div>

        <!-- MAP VIEW -->
        <div class="view-panel active" id="panelMap">
            <div class="map-section-title">📍 Our <em>Hanoi</em> Map</div>
            <div class="map-section-sub">Tap a pin to see our photos at that spot 💕</div>
            <div class="map-wrapper">
                <div id="hanoi-map"></div>
            </div>
        </div>

        <!-- CHECK-IN LIST VIEW -->
        <div class="view-panel" id="panelList">
            <div class="checkin-header">
                <div class="checkin-title">📋 Our <em>Check-ins</em></div>
                <div class="checkin-sub">Every place we've been together 💕 — tap to see photos</div>
            </div>
            <div class="checkin-list" id="checkinList"></div>
        </div>

        <!-- Map photo popup -->
        <div class="map-popup-overlay" id="mapPopup">
            <div class="map-popup-box">
                <div class="map-popup-header">
                    <div>
                        <div class="map-popup-icon" id="mapPopupIcon"></div>
                        <div class="map-popup-name" id="mapPopupName"></div>
                        <div class="map-popup-desc" id="mapPopupDesc"></div>
                    </div>
                    <button class="map-popup-close" onclick="closeMapPopup()">✕</button>
                </div>
                <div class="map-popup-body">
                    <div class="map-photo-grid" id="mapPhotoGrid"></div>
                </div>
            </div>
        </div>

        <!-- Full-size photo viewer -->
        <div class="map-viewer" id="mapViewer">
            <button class="map-viewer-close"
                onclick="document.getElementById('mapViewer').classList.remove('open')">✕</button>
            <img id="mapViewerImg" src="" alt="" />
        </div>

        <footer>
            Made with 💕 &nbsp;·&nbsp;
        </footer>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ===== LOVE COUNTER =====
        const LOVE_START = new Date('2026-02-06T00:00:00');
        function pad2(n) { return String(n).padStart(2, '0'); }
        function loveTick() {
            const diff = Date.now() - LOVE_START.getTime();
            if (diff < 0) return;
            const days = Math.floor(diff / 86400000);
            const rem = diff % 86400000;
            document.getElementById('lcDays').textContent = days.toLocaleString('vi-VN');
            document.getElementById('lcH').textContent = pad2(Math.floor(rem / 3600000));
            document.getElementById('lcM').textContent = pad2(Math.floor((rem % 3600000) / 60000));
            document.getElementById('lcS').textContent = pad2(Math.floor((rem % 60000) / 1000));
            document.getElementById('lcMs').textContent = pad2(Math.floor((rem % 1000) / 10));
        }
        loveTick();
        setInterval(loveTick, 50);

        // ===== PLACES DATA =====
        const mapPlaces = [
            {
                name: "Phu Sa Phin",
                icon: "🏞️",
                desc: "Lan trekking dau tienn",
                lat: 21.408675, lng: 104.325442,
                photos: [
                    { src: "images/IMG_2820.PNG", caption: "Us" },
                    { src: "images/IMG_1994.png", caption: "Sunrise" },
                ]
            },
            {
                name: "Hoan Kiem Lake",
                icon: "🏞️",
                desc: "The heart of the Old Quarter",
                lat: 21.0285, lng: 105.8524,
                photos: []
            },
            {
                name: "Old Quarter",
                icon: "🏮",
                desc: "36 streets full of charm",
                lat: 21.0340, lng: 105.8500,
                photos: []
            },
            {
                name: "Temple of Literature",
                icon: "🏛️",
                desc: "Vietnam's first university",
                lat: 21.0267, lng: 105.8355,
                photos: []
            },
            {
                name: "West Lake (Tây Hồ)",
                icon: "🌸",
                desc: "Sunset lotus tea & floating light",
                lat: 21.0600, lng: 105.8300,
                photos: []
            },
            {
                name: "Long Bien Bridge",
                icon: "🌉",
                desc: "The iconic 1902 railway bridge",
                lat: 21.0445, lng: 105.8600,
                photos: []
            },
            {
                name: "Dong Xuan Market",
                icon: "🛒",
                desc: "Hanoi's largest indoor market",
                lat: 21.0370, lng: 105.8490,
                photos: []
            }
        ];

        // ===== VIEW TOGGLE =====
        function switchView(view) {
            const panels = { map: 'panelMap', list: 'panelList' };
            const btns = { map: 'btnMap', list: 'btnList' };

            Object.keys(panels).forEach(k => {
                document.getElementById(panels[k]).classList.toggle('active', k === view);
                document.getElementById(btns[k]).classList.toggle('active', k === view);
            });

            if (view === 'map') {
                // Re-trigger map resize in case it was hidden on load
                setTimeout(() => map.invalidateSize(), 50);
            }
        }

        // ===== BUILD CHECK-IN LIST =====
        function buildCheckinList() {
            const list = document.getElementById('checkinList');
            list.innerHTML = '';

            if (mapPlaces.length === 0) {
                list.innerHTML = `<div class="checkin-empty"><div class="empty-icon">📍</div><div>No check-ins yet!</div></div>`;
                return;
            }

            mapPlaces.forEach(place => {
                const realPhotos = place.photos.filter(p => p && p.src);
                const item = document.createElement('div');
                item.className = 'checkin-item';
                item.innerHTML = `
                    <div class="checkin-item-icon">${place.icon}</div>
                    <div class="checkin-item-info">
                        <div class="checkin-item-name">${place.name}</div>
                        <div class="checkin-item-desc">${place.desc}</div>
                    </div>
                    <div class="checkin-item-right">
                        <div class="checkin-photo-count">📷 ${realPhotos.length} photo${realPhotos.length !== 1 ? 's' : ''}</div>
                        <div class="checkin-arrow">→</div>
                    </div>
                `;
                item.addEventListener('click', () => openMapPopup(place));
                list.appendChild(item);
            });
        }
        buildCheckinList();

        // ===== HANOI MAP =====
        const map = L.map('hanoi-map', {
            center: [21.0340, 105.8480],
            zoom: 14
        });

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        setTimeout(() => map.invalidateSize(), 300);

        mapPlaces.forEach(place => {
            const icon = L.divIcon({
                html: `<div class="custom-pin"><div class="custom-pin-inner">${place.icon}</div></div>`,
                className: '',
                iconSize: [38, 38],
                iconAnchor: [19, 38],
                popupAnchor: [0, -42]
            });

            const marker = L.marker([place.lat, place.lng], { icon }).addTo(map);
            marker.on('click', () => openMapPopup(place));
            marker.bindTooltip(`<b>${place.name}</b>`, {
                direction: 'top',
                offset: [0, -42]
            });
        });

        // ===== PHOTO POPUP =====
        function openMapPopup(place) {
            document.getElementById('mapPopupIcon').textContent = place.icon;
            document.getElementById('mapPopupName').textContent = place.name;
            document.getElementById('mapPopupDesc').textContent = place.desc;

            const grid = document.getElementById('mapPhotoGrid');
            grid.innerHTML = '';

            const realPhotos = place.photos.filter(p => p && p.src);

            if (realPhotos.length > 0) {
                realPhotos.forEach(photo => {
                    const item = document.createElement('div');
                    item.className = 'map-photo-item';
                    const img = document.createElement('img');
                    img.src = photo.src;
                    img.alt = photo.caption || place.name;
                    img.loading = 'lazy';
                    img.onclick = () => {
                        document.getElementById('mapViewerImg').src = photo.src;
                        document.getElementById('mapViewer').classList.add('open');
                    };
                    item.appendChild(img);
                    grid.appendChild(item);
                });
            } else {
                const ph = document.createElement('div');
                ph.className = 'map-photo-item';
                ph.innerHTML = `<div class="map-photo-placeholder"><div class="ph-icon">📷</div><div>No photos yet</div><code>images/yourphoto.jpg</code></div>`;
                grid.appendChild(ph);
            }

            document.getElementById('mapPopup').classList.add('open');
        }

        function closeMapPopup() {
            document.getElementById('mapPopup').classList.remove('open');
        }

        document.getElementById('mapPopup').addEventListener('click', function (e) {
            if (e.target === this) closeMapPopup();
        });

        document.getElementById('mapViewer').addEventListener('click', function (e) {
            if (e.target === this) this.classList.remove('open');
        });
    </script>
</body>

</html>
