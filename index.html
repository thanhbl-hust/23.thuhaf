<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Our Couple Bucket List 💕</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --bg: #fdf6f0;
            --card: #ffffff;
            --accent: #e8654a;
            --accent2: #f5a58c;
            --soft: #fde8e0;
            --text: #2a1a14;
            --muted: #a08070;
            --done-bg: #f0faf4;
            --done-border: #a8d5b5;
            --done-text: #2d7a4f;
            --todo-bg: #fff5f0;
            --todo-border: #f5c0a8;
            --todo-text: #c0532a;
            --shadow: 0 8px 40px rgba(232, 101, 74, 0.10);
            --radius: 18px;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 48px 16px 80px;
            position: relative;
            overflow-x: hidden;
        }

        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.18;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            width: 520px;
            height: 520px;
            background: var(--accent);
            top: -120px;
            right: -160px;
        }

        body::after {
            width: 400px;
            height: 400px;
            background: #f5c0a8;
            bottom: -100px;
            left: -100px;
        }

        .container {
            max-width: 860px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 52px;
            animation: fadeUp 0.7s ease both;
        }

        .heart-row {
            font-size: 1.8rem;
            letter-spacing: 8px;
            margin-bottom: 12px;
            animation: pulse 2.5s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1)
            }

            50% {
                transform: scale(1.08)
            }
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 6vw, 3.4rem);
            font-weight: 700;
            line-height: 1.15;
            margin-bottom: 10px;
        }

        h1 em {
            font-style: italic;
            color: var(--accent);
        }

        .subtitle {
            font-size: 1rem;
            color: var(--muted);
            font-weight: 300;
            letter-spacing: 0.04em;
        }

        .stats {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 40px;
            animation: fadeUp 0.7s 0.15s ease both;
        }

        .stat-card {
            background: var(--card);
            border-radius: 14px;
            padding: 18px 30px;
            box-shadow: var(--shadow);
            text-align: center;
            min-width: 130px;
        }

        .stat-num {
            font-family: 'Playfair Display', serif;
            font-size: 2.4rem;
            font-weight: 700;
            color: var(--accent);
            line-height: 1;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--muted);
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .progress-wrap {
            background: var(--card);
            border-radius: 12px;
            padding: 20px 28px;
            box-shadow: var(--shadow);
            margin-bottom: 40px;
            animation: fadeUp 0.7s 0.25s ease both;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 10px;
        }

        .progress-bar-bg {
            background: var(--soft);
            border-radius: 999px;
            height: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            background: linear-gradient(90deg, var(--accent2), var(--accent));
            height: 100%;
            border-radius: 999px;
            transition: width 1.2s cubic-bezier(.4, 0, .2, 1);
            width: 0%;
        }

        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 28px;
            animation: fadeUp 0.7s 0.3s ease both;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 11px 16px 11px 40px;
            border: 1.5px solid #ecddd5;
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.92rem;
            background: var(--card);
            color: var(--text);
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: var(--accent);
        }

        .search-box::before {
            content: '🔍';
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.9rem;
            pointer-events: none;
        }

        .filter-btns {
            display: flex;
            gap: 8px;
        }

        .filter-btn {
            padding: 10px 18px;
            border: 1.5px solid #ecddd5;
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
            background: var(--card);
            color: var(--muted);
            transition: all 0.2s;
            white-space: nowrap;
        }

        .filter-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .filter-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .table-wrap {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            animation: fadeUp 0.7s 0.35s ease both;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            background: var(--text);
            color: #fff;
            padding: 16px 20px;
            text-align: left;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        thead th:last-child {
            text-align: center;
        }

        tbody tr {
            border-bottom: 1px solid #f3e8e0;
            transition: background 0.15s;
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        tbody tr.done-row {
            cursor: pointer;
        }

        tbody tr.done-row:hover {
            background: #fdf0ea;
        }

        tbody tr.todo-row:hover {
            background: #fffaf8;
        }

        td {
            padding: 15px 20px;
            font-size: 0.93rem;
            vertical-align: middle;
        }

        .td-num {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            color: var(--accent2);
            font-weight: 700;
            width: 40px;
        }

        .td-activity {
            min-width: 200px;
        }

        .activity-name {
            font-weight: 500;
            color: var(--text);
        }

        .done-row .activity-name {
            text-decoration: line-through;
            color: var(--muted);
        }

        .activity-note {
            font-size: 0.8rem;
            color: var(--muted);
            margin-top: 2px;
        }

        .photo-hint {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
            color: var(--accent);
            margin-top: 5px;
            font-weight: 500;
        }

        .td-date {
            width: 120px;
            font-size: 0.85rem;
            color: var(--muted);
        }

        .td-status {
            width: 110px;
            text-align: center;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 500;
        }

        .status-done {
            background: var(--done-bg);
            color: var(--done-text);
            border: 1px solid var(--done-border);
        }

        .status-todo {
            background: var(--todo-bg);
            color: var(--todo-text);
            border: 1px solid var(--todo-border);
        }

        .td-toggle {
            width: 56px;
            text-align: center;
        }

        .toggle-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s;
        }

        .toggle-btn:hover {
            transform: scale(1.15);
        }

        .toggle-btn.btn-done {
            background: var(--done-bg);
        }

        .toggle-btn.btn-todo {
            background: var(--todo-bg);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
            display: none;
        }

        .empty-state .empty-icon {
            font-size: 3rem;
            margin-bottom: 12px;
        }

        /* ===== LIGHTBOX ===== */
        .lb-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(20, 10, 8, 0.88);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(6px);
        }

        .lb-overlay.open {
            display: flex;
        }

        .lb-box {
            background: var(--card);
            border-radius: 24px;
            max-width: 780px;
            width: 100%;
            max-height: 90vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            animation: popIn 0.35s cubic-bezier(.34, 1.56, .64, 1) both;
            box-shadow: 0 32px 100px rgba(232, 101, 74, 0.25);
        }

        @keyframes popIn {
            from {
                transform: scale(0.82);
                opacity: 0
            }

            to {
                transform: scale(1);
                opacity: 1
            }
        }

        .lb-header {
            padding: 20px 24px 16px;
            border-bottom: 1px solid #f3e8e0;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-shrink: 0;
        }

        .lb-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem;
            color: var(--text);
            line-height: 1.3;
        }

        .lb-date {
            font-size: 0.8rem;
            color: var(--muted);
            margin-top: 3px;
        }

        .lb-close {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: var(--muted);
            line-height: 1;
            padding: 2px 8px;
            border-radius: 6px;
            transition: background 0.15s;
        }

        .lb-close:hover {
            background: var(--soft);
        }

        .lb-body {
            overflow-y: auto;
            padding: 20px 24px 24px;
            flex: 1;
        }

        .lb-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 12px;
        }

        .lb-grid-item {
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 1/1;
            background: var(--soft);
            cursor: zoom-in;
            position: relative;
        }

        .lb-grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
            display: block;
        }

        .lb-grid-item:hover img {
            transform: scale(1.06);
        }

        .lb-grid-item .img-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(42, 26, 20, 0.72));
            color: #fff;
            font-size: 0.75rem;
            padding: 22px 10px 8px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .lb-grid-item:hover .img-caption {
            opacity: 1;
        }

        .lb-empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--muted);
        }

        .lb-empty .lb-empty-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .lb-empty code {
            background: var(--soft);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.82rem;
            color: var(--accent);
        }

        /* Full viewer */
        .lb-viewer {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(10, 5, 4, 0.96);
            z-index: 300;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .lb-viewer.open {
            display: flex;
        }

        .lb-viewer img {
            max-width: 92vw;
            max-height: 82vh;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            object-fit: contain;
        }

        .lb-viewer-close {
            position: absolute;
            top: 20px;
            right: 24px;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: #fff;
            font-size: 1.6rem;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .lb-viewer-close:hover {
            background: rgba(255, 255, 255, 0.28);
        }

        .lb-viewer-caption {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.85rem;
            margin-top: 14px;
        }

        .lb-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: #fff;
            font-size: 1.6rem;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .lb-nav:hover {
            background: rgba(255, 255, 255, 0.28);
        }

        .lb-nav-prev {
            left: 20px;
        }

        .lb-nav-next {
            right: 20px;
        }

        /* Love counter */
        .love-counter {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 28px 24px;
            margin-bottom: 40px;
            text-align: center;
            animation: fadeUp 0.7s 0.12s ease both;
        }

        .lc-label {
            font-size: 0.78rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 6px;
        }

        .lc-days {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.8rem, 8vw, 4.2rem);
            font-weight: 700;
            color: var(--accent);
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .lc-days-unit {
            font-size: 1rem;
            color: var(--muted);
            margin: 2px 0 16px;
        }

        .lc-grid {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .lc-unit {
            background: var(--soft);
            border-radius: 12px;
            padding: 12px 18px;
            min-width: 72px;
        }

        .lc-num {
            font-size: 1.7rem;
            font-weight: 700;
            color: var(--text);
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }

        .lc-unit-label {
            font-size: 0.7rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-top: 4px;
        }

        .lc-since {
            font-size: 0.78rem;
            color: var(--muted);
            margin-top: 14px;
        }

        footer {
            text-align: center;
            margin-top: 52px;
            font-size: 0.82rem;
            color: var(--muted);
            animation: fadeUp 0.7s 0.6s ease both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(22px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        @media (max-width: 640px) {
            .td-date {
                display: none;
            }

            td,
            th {
                padding: 12px 12px;
            }

            .lb-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

        // Love counter
        const LOVE_START = new Date('2026-02-06T00:00:00');
        function pad2(n) { return String(n).padStart(2, '0'); }
        function loveTick() {
            const diff = Date.now() - LOVE_START.getTime();
            if (diff < 0) return;
            const days = Math.floor(diff / 86400000);
            const rem = diff % 86400000;
            document.getElementById('lcDays').textContent = days.toLocaleString('vi-VN');
            document.getElementById('lcH').textContent = pad2(Math.floor(rem / 3600000));
            document.getElementById('lcM').textContent = pad2(Math.floor((rem % 3600000) / 60000));
            document.getElementById('lcS').textContent = pad2(Math.floor((rem % 60000) / 1000));
            document.getElementById('lcMs').textContent = pad2(Math.floor((rem % 1000) / 10));
        }
        loveTick();
        setInterval(loveTick, 50);
        renderTable();
        setTimeout(() => {
            const pct = items.filter(i => i.done).length / items.length * 100;
            document.getElementById('progressFill').style.width = Math.round(pct) + '%';
        }, 300);
