<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#b4e1ee" />
    <!-- Personal page: keep it out of search engines -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Our Journey</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
    <!-- Start connecting to the font, library and map servers right away -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://unpkg.com" crossorigin />
    <link rel="preconnect" href="https://tiles.versatiles.org" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet" />
    <!-- integrity= makes the browser refuse a library file that was changed on the CDN -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
        integrity="sha384-pmjIAcz2bAn0xukfxADbZIb3t8oRT9Sv0rvO+BR5Csr6Dhqq+nZs59P0pPKQJkEV" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css"
        integrity="sha384-uTttxo/aOKbdE5RlD/SPzSDoDmNvGlUYPjONi2MN/b7c9HPSvW07OIuyP7uL6jxK" crossorigin="anonymous" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- One screen, no page scroll: counter pinned on top, then the tabs, then the active view -->
    <div class="app">

        <!-- LOVE COUNTER -->
        <header class="love-counter">
            <div class="lc-label">🐴 &nbsp; luv &nbsp; ✈️</div>
            <div class="lc-main">
                <div class="lc-days" id="lcDays">0</div>
                <div class="lc-days-unit">Days</div>
            </div>
            <div class="lc-grid">
                <div class="lc-unit">
                    <div class="lc-num" id="lcH">00</div>
                    <div class="lc-unit-label">Hours</div>
                </div>
                <div class="lc-unit">
                    <div class="lc-num" id="lcM">00</div>
                    <div class="lc-unit-label">Minutes</div>
                </div>
                <div class="lc-unit">
                    <div class="lc-num" id="lcS">00</div>
                    <div class="lc-unit-label">Seconds</div>
                </div>
            </div>
            <div class="lc-since">💕 Since 06/02/2026</div>
        </header>

        <!-- TABS -->
        <nav class="view-toggle">
            <button class="view-toggle-btn active" id="btnMap" onclick="switchView('map')">
                <span class="btn-icon">🗺️</span><span class="btn-label">Our Map</span>
            </button>
            <button class="view-toggle-btn" id="btnList" onclick="switchView('list')">
                <span class="btn-icon">📋</span><span class="btn-label">Checked-ins</span>
            </button>
            <button class="view-toggle-btn" id="btnCal" onclick="switchView('cal')">
                <span class="btn-icon">📅</span><span class="btn-label">Calendar</span>
            </button>
        </nav>

        <main class="stage">
            <!-- MAP VIEW -->
            <section class="view-panel active" id="panelMap">
                <div class="panel-title">📍 Our <em>City</em> Map</div>
                <div class="map-wrapper">
                    <div id="hanoi-map"></div>
                </div>
            </section>

            <!-- CHECK-IN LIST VIEW -->
            <section class="view-panel" id="panelList">
                <div class="panel-title">📋 Our <em>Checked-in</em></div>
                <div class="sort-bar">
                    <span class="sort-label">Sort by:</span>
                    <button class="sort-btn active" id="sortAZ" onclick="setSort('az')">
                        <span class="sort-icon">🔤</span> A → Z
                    </button>
                    <button class="sort-btn" id="sortVisits" onclick="setSort('visits')">
                        <span class="sort-icon">🗓</span> Most visited
                    </button>
                </div>
                <div class="checkin-list" id="checkinList"></div>
            </section>

            <!-- CALENDAR VIEW -->
            <section class="view-panel" id="panelCal">
                <div class="panel-title">📅 Our <em>Journey</em></div>
                <div class="calendar-grid-wrap">
                    <!-- Months are appended here by script.js, oldest first -->
                    <div class="cal-scroll" id="calScroll">
                        <div class="cal-weekdays">
                            <div class="cal-weekday">Sun</div>
                            <div class="cal-weekday">Mon</div>
                            <div class="cal-weekday">Tue</div>
                            <div class="cal-weekday">Wed</div>
                            <div class="cal-weekday">Thu</div>
                            <div class="cal-weekday">Fri</div>
                            <div class="cal-weekday">Sat</div>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <footer>Made with 💕 &nbsp;·&nbsp;</footer>
    </div>

    <!-- Map photo popup -->
    <div class="map-popup-overlay" id="mapPopup">
        <div class="map-popup-box">
            <div class="map-popup-header">
                <div>
                    <div class="map-popup-icon" id="mapPopupIcon"></div>
                    <div class="map-popup-name" id="mapPopupName"></div>
                    <div class="map-popup-desc" id="mapPopupDesc"></div>
                </div>
                <button class="map-popup-close" aria-label="Close" onclick="closeMapPopup()">✕</button>
            </div>
            <div class="map-popup-body" id="mapPopupBody"></div>
        </div>
    </div>

    <!-- Full-size photo viewer -->
    <div class="map-viewer" id="mapViewer">
        <button class="map-viewer-close" aria-label="Close photo" onclick="closePhotoViewer()">✕</button>
        <img id="mapViewerImg" src="" alt="" />
    </div>

    <!-- ① Load data first, then the app logic -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"
        integrity="sha384-eXVCORTRlv4FUUgS/xmOyr66XBVraen8ATNLMESp92FKXLAMiKkerixTiBvXriZr" crossorigin="anonymous"></script>
    <!-- Vector base map: MapLibre draws it inside the Leaflet map -->
    <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"
        integrity="sha384-5+cfbwT0iiub6VsQAdn6yz16nr6sDiQoHx6tm4O8OVYXHYOxcffFmCJBL0dgdvGp" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"
        integrity="sha384-tXYNKOHx4T02jMP7YYCtBxPIv1B5gaA5mcVPBzqMp6d7VzWzxJgI2aWF/nJLrQdS" crossorigin="anonymous"></script>
    <script src="places.js"></script>
    <script src="script.js"></script>
</body>

</html>
