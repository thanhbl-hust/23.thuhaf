<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Our Journey</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg: #b4e1ee;
            --card: #ffffff;
            --accent: #0f6295;
            --accent2: #85b2d7;
            --soft: #fde8e0;
            --text: #0f6295;
            --muted: #87b0d6;
            --shadow: 0 8px 40px rgba(232, 101, 74, 0.10);
            --radius: 18px;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 48px 16px 80px;
            position: relative;
            overflow-x: hidden;
        }

        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.18;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            width: 520px;
            height: 520px;
            background: var(--accent);
            top: -120px;
            right: -160px;
        }

        body::after {
            width: 400px;
            height: 400px;
            background: #f5c0a8;
            bottom: -100px;
            left: -100px;
        }

        .container {
            max-width: 860px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 6vw, 3.4rem);
            font-weight: 700;
            line-height: 1.15;
            margin-bottom: 10px;
        }

        h1 em {
            font-style: italic;
            color: var(--accent);
        }

        /* Love counter */
        .love-counter {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 28px 24px;
            margin-bottom: 40px;
            text-align: center;
            animation: fadeUp 0.7s 0.12s ease both;
        }

        .lc-label {
            font-size: 3rem;
            color: var(--muted);
            letter-spacing: 0.1em;
            margin-bottom: 6px;
        }

        .lc-days {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.8rem, 8vw, 4.2rem);
            font-weight: 700;
            color: var(--accent);
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .lc-days-unit {
            font-size: 1rem;
            color: var(--muted);
            margin: 2px 0 16px;
        }

        .lc-grid {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .lc-unit {
            background: var(--soft);
            border-radius: 12px;
            padding: 12px 18px;
            min-width: 72px;
        }

        .lc-num {
            font-size: 1.7rem;
            font-weight: 700;
            color: var(--text);
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }

        .lc-unit-label {
            font-size: 0.7rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-top: 4px;
        }

        .lc-since {
            font-size: 0.78rem;
            color: var(--muted);
            margin-top: 14px;
        }

        /* Tab toggle — centered */
        .view-toggle {
            display: flex;
            background: var(--card);
            border-radius: 14px;
            box-shadow: var(--shadow);
            padding: 6px;
            margin: 0 auto 24px auto;
            animation: fadeUp 0.7s 0.2s ease both;
            width: 100%;
            max-width: fit-content;
            box-sizing: border-box;
        }

        .view-toggle-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 11px 20px;
            border: none;
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            background: transparent;
            color: var(--muted);
            transition: all 0.25s cubic-bezier(.4, 0, .2, 1);
            white-space: nowrap;
        }

        .view-toggle-btn .btn-icon {
            font-size: 1.05rem;
            transition: transform 0.25s;
            flex-shrink: 0;
        }

        .view-toggle-btn .btn-label {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .view-toggle-btn:hover {
            color: var(--accent);
        }

        .view-toggle-btn.active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 16px rgba(15, 98, 149, 0.30);
        }

        .view-toggle-btn.active .btn-icon {
            transform: scale(1.15);
        }

        /* View panels */
        .view-panel {
            display: none;
            animation: fadeUp 0.4s ease both;
        }

        .view-panel.active {
            display: block;
        }

        /* Map section */
        .map-section-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text);
        }

        .map-section-title em {
            color: var(--accent);
            font-style: italic;
        }

        .map-wrapper {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        #hanoi-map {
            width: 100%;
            height: 460px;
        }

        /* Check-in list */
        .checkin-header {
            margin-bottom: 14px;
        }

        .checkin-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
        }

        .checkin-title em {
            color: var(--accent);
            font-style: italic;
        }

        /* Sort bar */
        .sort-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .sort-label {
            font-size: 0.8rem;
            color: var(--muted);
            font-weight: 500;
            margin-right: 2px;
        }

        .sort-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 7px 16px;
            border-radius: 999px;
            border: 1.5px solid #c8d8e8;
            background: var(--card);
            color: var(--muted);
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.18s;
            box-shadow: var(--shadow);
        }

        .sort-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .sort-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            box-shadow: 0 4px 12px rgba(15, 98, 149, 0.25);
        }

        .sort-btn .sort-icon {
            font-size: 0.95rem;
        }

        .checkin-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .checkin-item {
            background: var(--card);
            border-radius: 14px;
            box-shadow: var(--shadow);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            transition: transform 0.18s, box-shadow 0.18s;
            border: 2px solid transparent;
        }

        .checkin-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 40px rgba(15, 98, 149, 0.14);
            border-color: var(--accent2);
        }

        .checkin-item-heart {
            font-size: 1.4rem;
            flex-shrink: 0;
            line-height: 1;
        }

        .checkin-item-info {
            flex: 1;
            min-width: 0;
        }

        .checkin-item-name {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text);
            margin-bottom: 2px;
        }

        .checkin-item-desc {
            font-size: 0.82rem;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .checkin-item-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
            flex-shrink: 0;
        }

        .checkin-photo-count {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.78rem;
            color: var(--accent);
            font-weight: 500;
            background: rgba(15, 98, 149, 0.08);
            padding: 3px 10px;
            border-radius: 999px;
        }

        .checkin-video-count {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.78rem;
            color: #7a3f0a;
            font-weight: 500;
            background: rgba(200, 120, 20, 0.10);
            padding: 3px 10px;
            border-radius: 999px;
        }

        .checkin-visit-count {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.78rem;
            color: #0a7a3c;
            font-weight: 500;
            background: rgba(15, 149, 75, 0.08);
            padding: 3px 10px;
            border-radius: 999px;
        }

        .checkin-arrow {
            font-size: 0.85rem;
            color: var(--muted);
        }

        .checkin-empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        /* ===== CALENDAR ===== */
        .calendar-header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .cal-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
        }

        .cal-title em {
            color: var(--accent);
            font-style: italic;
        }

        .cal-nav {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cal-nav-btn {
            background: var(--card);
            border: 1.5px solid #c8d8e8;
            color: var(--accent);
            border-radius: 10px;
            width: 36px;
            height: 36px;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.18s;
            box-shadow: var(--shadow);
        }

        .cal-nav-btn:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .cal-month-label {
            font-family: 'Playfair Display', serif;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text);
            min-width: 140px;
            text-align: center;
        }

        .calendar-grid-wrap {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .cal-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            background: var(--accent);
        }

        .cal-weekday {
            text-align: center;
            padding: 10px 4px;
            font-size: 0.75rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .cal-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0;
        }

        .cal-day {
            border-right: 1px solid #eef4f8;
            border-bottom: 1px solid #eef4f8;
            min-height: 90px;
            padding: 6px;
            position: relative;
            transition: background 0.15s;
        }

        .cal-day:nth-child(7n) {
            border-right: none;
        }

        .cal-day.other-month {
            background: #f7fbfd;
        }

        .cal-day.other-month .cal-day-num {
            color: #cce0ee;
        }

        .cal-day.today {
            background: rgba(15, 98, 149, 0.04);
        }

        .cal-day.today .cal-day-num {
            background: var(--accent);
            color: #fff;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .cal-day.has-visit {
            cursor: pointer;
        }

        .cal-day.has-visit:hover {
            background: rgba(15, 98, 149, 0.06);
        }

        .cal-day-num {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 4px;
            line-height: 1;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cal-day-photos {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .cal-day-thumb {
            width: 100%;
            aspect-ratio: 16/10;
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }

        .cal-day-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .cal-day-place-pill {
            background: rgba(15, 98, 149, 0.10);
            border-radius: 6px;
            padding: 4px 6px;
            font-size: 0.68rem;
            color: var(--accent);
            font-weight: 500;
            line-height: 1.3;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .cal-day-more {
            font-size: 0.65rem;
            color: var(--muted);
            text-align: right;
            margin-top: 1px;
        }

        /* Birthday styles */
        .cal-birthday-cake {
            font-size: 0.75rem;
            line-height: 1;
            animation: cakeBounce 1.8s ease-in-out infinite;
        }

        @keyframes cakeBounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-3px);
            }
        }

        .cal-day.is-birthday {
            background: linear-gradient(135deg, rgba(253, 232, 224, 0.55) 0%, rgba(255, 245, 200, 0.45) 100%);
        }

        .cal-day.is-birthday.today {
            background: linear-gradient(135deg, rgba(253, 232, 224, 0.7) 0%, rgba(255, 245, 200, 0.6) 100%);
        }

        .cal-birthday-solo {
            font-size: 1.4rem;
            text-align: center;
            margin-top: 4px;
            animation: cakeBounce 1.8s ease-in-out infinite;
        }

        /* Map popup */
        .map-popup-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(20, 10, 8, 0.80);
            z-index: 400;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(6px);
        }

        .map-popup-overlay.open {
            display: flex;
        }

        .map-popup-box {
            background: var(--card);
            border-radius: 24px;
            max-width: 680px;
            width: 100%;
            max-height: 88vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            animation: popIn 0.35s cubic-bezier(.34, 1.56, .64, 1) both;
            box-shadow: 0 32px 100px rgba(232, 101, 74, 0.28);
        }

        @keyframes popIn {
            from {
                transform: scale(0.82);
                opacity: 0
            }

            to {
                transform: scale(1);
                opacity: 1
            }
        }

        .map-popup-header {
            padding: 20px 24px 14px;
            border-bottom: 1px solid #f3e8e0;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-shrink: 0;
        }

        .map-popup-icon {
            font-size: 1.5rem;
            margin-bottom: 2px;
        }

        .map-popup-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            color: var(--text);
            line-height: 1.3;
        }

        .map-popup-desc {
            font-size: 0.8rem;
            color: var(--muted);
            margin-top: 2px;
        }

        .map-popup-close {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: var(--muted);
            padding: 2px 8px;
            border-radius: 6px;
            transition: background 0.15s;
            flex-shrink: 0;
        }

        .map-popup-close:hover {
            background: var(--soft);
        }

        .map-popup-body {
            overflow-y: auto;
            padding: 20px 24px 24px;
            flex: 1;
        }

        /* Visit tabs */
        .visit-tab-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .visit-tab {
            padding: 6px 14px;
            border-radius: 10px;
            border: 1.5px solid #c8d8e8;
            background: transparent;
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.18s;
        }

        .visit-tab:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .visit-tab.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .visit-empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--muted);
        }

        .visit-empty-state .empty-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .media-section-label {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin: 18px 0 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .media-section-label:first-child {
            margin-top: 0;
        }

        .map-photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 10px;
        }

        .map-photo-item {
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 1/1;
            background: var(--soft);
            cursor: zoom-in;
            position: relative;
        }

        .map-photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
            display: block;
        }

        .map-photo-item:hover img {
            transform: scale(1.06);
        }

        .map-video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
        }

        .map-video-item {
            border-radius: 12px;
            overflow: hidden;
            background: #1a1a2e;
            position: relative;
        }

        .map-video-item video {
            width: 100%;
            display: block;
            border-radius: 12px;
            max-height: 220px;
            object-fit: cover;
            background: #1a1a2e;
        }

        .map-photo-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: var(--muted);
            font-size: 0.78rem;
            text-align: center;
            padding: 12px;
        }

        .map-photo-placeholder .ph-icon {
            font-size: 2rem;
        }

        .map-photo-placeholder code {
            background: #f3e8e0;
            padding: 2px 7px;
            border-radius: 5px;
            font-size: 0.72rem;
            color: var(--accent);
            word-break: break-all;
        }

        /* Full-size photo viewer */
        .map-viewer {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(10, 5, 4, 0.96);
            z-index: 500;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .map-viewer.open {
            display: flex;
        }

        .map-viewer img {
            max-width: 92vw;
            max-height: 82vh;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            object-fit: contain;
        }

        .map-viewer-close {
            position: absolute;
            top: 20px;
            right: 24px;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: #fff;
            font-size: 1.6rem;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .map-viewer-close:hover {
            background: rgba(255, 255, 255, 0.28);
        }

        /* Custom pin markers */
        .custom-pin {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            background: var(--accent);
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            box-shadow: 0 4px 14px rgba(232, 101, 74, 0.45);
            border: 3px solid #fff;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .custom-pin:hover {
            transform: rotate(-45deg) scale(1.15);
            box-shadow: 0 6px 20px rgba(232, 101, 74, 0.6);
        }

        .custom-pin-inner {
            transform: rotate(45deg);
            font-size: 1rem;
            line-height: 1;
        }

        .heart-pin {
            cursor: pointer;
            filter: drop-shadow(0 4px 6px rgba(232, 69, 90, 0.55));
            animation: heartBeat 2s ease-in-out infinite;
        }

        @keyframes heartBeat {

            0%,
            100% {
                transform: scale(1)
            }

            14% {
                transform: scale(1.18)
            }

            28% {
                transform: scale(1)
            }

            42% {
                transform: scale(1.12)
            }

            56% {
                transform: scale(1)
            }
        }

        footer {
            text-align: center;
            margin-top: 52px;
            font-size: 0.82rem;
            color: var(--muted);
            animation: fadeUp 0.7s 0.6s ease both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(22px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        @media (max-width: 640px) {
            #hanoi-map {
                height: 320px;
            }

            .view-toggle {
                width: 100%;
                max-width: 100%;
            }

            .view-toggle-btn {
                flex: 1;
                min-width: 0;
                padding: 10px 6px;
                font-size: 0.78rem;
                gap: 4px;
            }

            .cal-day {
                min-height: 64px;
            }
        }

        /* Very small screens: stack icon above short label */
        @media (max-width: 380px) {
            .view-toggle-btn {
                flex-direction: column;
                gap: 2px;
                padding: 8px 4px;
                font-size: 0.68rem;
            }

            .view-toggle-btn .btn-icon {
                font-size: 1.2rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <!-- LOVE COUNTER -->
        <div class="love-counter">
            <div class="lc-label">🐴 &nbsp; luv &nbsp; ✈️</div>
            <div class="lc-days" id="lcDays">0</div>
            <div class="lc-days-unit">Days</div>
            <div class="lc-grid">
                <div class="lc-unit">
                    <div class="lc-num" id="lcH">00</div>
                    <div class="lc-unit-label">Hours</div>
                </div>
                <div class="lc-unit">
                    <div class="lc-num" id="lcM">00</div>
                    <div class="lc-unit-label">Minutes</div>
                </div>
                <div class="lc-unit">
                    <div class="lc-num" id="lcS">00</div>
                    <div class="lc-unit-label">Seconds</div>
                </div>
            </div>
            <div class="lc-since">💕 Since 06/02/2026</div>
        </div>

        <!-- TAB TOGGLE -->
        <div class="view-toggle">
            <button class="view-toggle-btn active" id="btnMap" onclick="switchView('map')">
                <span class="btn-icon">🗺️</span><span class="btn-label">Our Map</span>
            </button>
            <button class="view-toggle-btn" id="btnList" onclick="switchView('list')">
                <span class="btn-icon">📋</span><span class="btn-label">Checked-ins</span>
            </button>
            <button class="view-toggle-btn" id="btnCal" onclick="switchView('cal')">
                <span class="btn-icon">📅</span><span class="btn-label">Calendar</span>
            </button>
        </div>

        <!-- MAP VIEW -->
        <div class="view-panel active" id="panelMap">
            <div class="map-section-title">📍 Our <em>City</em> Map</div>
            <div class="map-wrapper">
                <div id="hanoi-map"></div>
            </div>
        </div>

        <!-- CHECK-IN LIST VIEW -->
        <div class="view-panel" id="panelList">
            <div class="checkin-header">
                <div class="checkin-title">📋 Our <em>Checked-in</em></div>
            </div>
            <div class="sort-bar">
                <span class="sort-label">Sort by:</span>
                <button class="sort-btn active" id="sortAZ" onclick="setSort('az')">
                    <span class="sort-icon">🔤</span> A → Z
                </button>
                <button class="sort-btn" id="sortVisits" onclick="setSort('visits')">
                    <span class="sort-icon">🗓</span> Most visited
                </button>
            </div>
            <div class="checkin-list" id="checkinList"></div>
        </div>

        <!-- CALENDAR VIEW -->
        <div class="view-panel" id="panelCal">
            <div class="calendar-header-bar">
                <div class="cal-title">📅 Our <em>Journey</em></div>
                <div class="cal-nav">
                    <button class="cal-nav-btn" onclick="calShift(-1)">‹</button>
                    <div class="cal-month-label" id="calMonthLabel"></div>
                    <button class="cal-nav-btn" onclick="calShift(1)">›</button>
                </div>
            </div>
            <div class="calendar-grid-wrap">
                <div class="cal-weekdays">
                    <div class="cal-weekday">Sun</div>
                    <div class="cal-weekday">Mon</div>
                    <div class="cal-weekday">Tue</div>
                    <div class="cal-weekday">Wed</div>
                    <div class="cal-weekday">Thu</div>
                    <div class="cal-weekday">Fri</div>
                    <div class="cal-weekday">Sat</div>
                </div>
                <div class="cal-days" id="calDays"></div>
            </div>
        </div>

        <!-- Map photo popup -->
        <div class="map-popup-overlay" id="mapPopup">
            <div class="map-popup-box">
                <div class="map-popup-header">
                    <div>
                        <div class="map-popup-icon" id="mapPopupIcon"></div>
                        <div class="map-popup-name" id="mapPopupName"></div>
                        <div class="map-popup-desc" id="mapPopupDesc"></div>
                    </div>
                    <button class="map-popup-close" onclick="closeMapPopup()">✕</button>
                </div>
                <div class="map-popup-body" id="mapPopupBody"></div>
            </div>
        </div>

        <!-- Full-size photo viewer -->
        <div class="map-viewer" id="mapViewer">
            <button class="map-viewer-close"
                onclick="document.getElementById('mapViewer').classList.remove('open')">✕</button>
            <img id="mapViewerImg" src="" alt="" />
        </div>

        <footer>Made with 💕 &nbsp;·&nbsp;</footer>
    </div>

    <!-- ① Load data first, then the app logic -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="places.js"></script>
    <script>
        // ===== LOVE COUNTER =====
        const LOVE_START = new Date('2026-02-06T00:00:00');
        function pad2(n) { return String(n).padStart(2, '0'); }
        function loveTick() {
            const diff = Date.now() - LOVE_START.getTime();
            if (diff < 0) return;
            const days = Math.floor(diff / 86400000);
            const rem = diff % 86400000;
            document.getElementById('lcDays').textContent = days.toLocaleString('vi-VN');
            document.getElementById('lcH').textContent = pad2(Math.floor(rem / 3600000));
            document.getElementById('lcM').textContent = pad2(Math.floor((rem % 3600000) / 60000));
            document.getElementById('lcS').textContent = pad2(Math.floor((rem % 60000) / 1000));
        }
        loveTick();
        setInterval(loveTick, 1000);

        // ===== BUILD DATE → VISITS INDEX =====
        function buildDateIndex() {
            const idx = {};
            mapPlaces.forEach(place => {
                place.visits.forEach((visit, vi) => {
                    if (!visit.date) return;
                    if (!idx[visit.date]) idx[visit.date] = [];
                    idx[visit.date].push({ place, visitIdx: vi });
                });
            });
            return idx;
        }
        const dateVisitMap = buildDateIndex();

        // ===== SORT STATE =====
        let currentSort = 'az';

        function setSort(mode) {
            currentSort = mode;
            document.getElementById('sortAZ').classList.toggle('active', mode === 'az');
            document.getElementById('sortVisits').classList.toggle('active', mode === 'visits');
            buildCheckinList();
        }

        function getSortedPlaces() {
            const copy = [...mapPlaces];
            if (currentSort === 'az') {
                copy.sort((a, b) => {
                    const nc = a.name.localeCompare(b.name);
                    return nc !== 0 ? nc : b.visits.length - a.visits.length;
                });
            } else {
                copy.sort((a, b) => {
                    const vc = b.visits.length - a.visits.length;
                    return vc !== 0 ? vc : a.name.localeCompare(b.name);
                });
            }
            return copy;
        }

        // ===== VIEW TOGGLE =====
        function switchView(view) {
            ['map', 'list', 'cal'].forEach(k => {
                const key = k.charAt(0).toUpperCase() + k.slice(1);
                document.getElementById('panel' + key).classList.toggle('active', k === view);
                document.getElementById('btn' + key).classList.toggle('active', k === view);
            });
            if (view === 'map') setTimeout(() => map.invalidateSize(), 50);
            if (view === 'cal') renderCalendar();
        }

        // ===== CHECK-IN LIST =====
        function buildCheckinList() {
            const list = document.getElementById('checkinList');
            list.innerHTML = '';
            const sorted = getSortedPlaces();
            if (sorted.length === 0) {
                list.innerHTML = `<div class="checkin-empty"><div class="empty-icon">📍</div><div>No check-ins yet!</div></div>`;
                return;
            }
            sorted.forEach(place => {
                const totalPhotos = place.visits.reduce((s, v) => s + (v.photos || []).filter(p => p?.src).length, 0);
                const totalVideos = place.visits.reduce((s, v) => s + (v.videos || []).filter(x => x?.src).length, 0);
                const visitCount = place.visits.length;
                const item = document.createElement('div');
                item.className = 'checkin-item';
                item.innerHTML = `
                    <div class="checkin-item-heart">💕</div>
                    <div class="checkin-item-info">
                        <div class="checkin-item-name">${place.name}</div>
                        <div class="checkin-item-desc">${place.desc}</div>
                    </div>
                    <div class="checkin-item-right">
                        <div class="checkin-photo-count">📷 ${totalPhotos} photo${totalPhotos !== 1 ? 's' : ''}</div>
                        ${totalVideos > 0 ? `<div class="checkin-video-count">🎬 ${totalVideos} video${totalVideos !== 1 ? 's' : ''}</div>` : ''}
                        <div class="checkin-visit-count">🗓 ${visitCount} visit${visitCount !== 1 ? 's' : ''}</div>
                        <div class="checkin-arrow">→</div>
                    </div>`;
                item.addEventListener('click', () => openMapPopup(place));
                list.appendChild(item);
            });
        }
        buildCheckinList();

        // ===== BIRTHDAYS =====
        // Format: "MM-DD"
        const BIRTHDAYS = new Set(["12-10", "06-23"]);
        function isBirthday(month0, day) {
            return BIRTHDAYS.has(pad2(month0 + 1) + "-" + pad2(day));
        }

        // ===== CALENDAR =====
        let calYear = new Date().getFullYear();
        let calMonth = new Date().getMonth();

        function calShift(delta) {
            calMonth += delta;
            if (calMonth < 0) { calMonth = 11; calYear--; }
            if (calMonth > 11) { calMonth = 0; calYear++; }
            renderCalendar();
        }

        function renderCalendar() {
            const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
            document.getElementById('calMonthLabel').textContent = months[calMonth] + ' ' + calYear;

            const grid = document.getElementById('calDays');
            grid.innerHTML = '';

            const today = new Date();
            const firstDay = new Date(calYear, calMonth, 1).getDay();
            const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
            const daysInPrev = new Date(calYear, calMonth, 0).getDate();

            for (let i = firstDay - 1; i >= 0; i--)  appendDay(grid, daysInPrev - i, true, null, null, null, null);
            for (let d = 1; d <= daysInMonth; d++) {
                const isToday = (d === today.getDate() && calMonth === today.getMonth() && calYear === today.getFullYear());
                const dateStr = `${calYear}-${pad2(calMonth + 1)}-${pad2(d)}`;
                appendDay(grid, d, false, isToday, dateVisitMap[dateStr] || null, calMonth, d);
            }
            const trailing = (firstDay + daysInMonth) % 7;
            if (trailing) for (let i = 1; i <= 7 - trailing; i++) appendDay(grid, i, true, null, null, null, null);
        }

        function appendDay(grid, dayNum, otherMonth, isToday, entries, month0, day) {
            const birthday = !otherMonth && month0 != null && isBirthday(month0, day);

            const cell = document.createElement('div');
            cell.className = 'cal-day' +
                (otherMonth ? ' other-month' : '') +
                (isToday ? ' today' : '') +
                (entries ? ' has-visit' : '') +
                (birthday ? ' is-birthday' : '');

            // Date number row — cake sits next to number if there are entries
            const numRow = document.createElement('div');
            numRow.style.cssText = 'display:flex;align-items:center;gap:3px;';

            const numEl = document.createElement('div');
            numEl.className = 'cal-day-num';
            numEl.textContent = dayNum;
            numRow.appendChild(numEl);

            if (birthday && entries?.length > 0) {
                const cake = document.createElement('span');
                cake.className = 'cal-birthday-cake';
                cake.textContent = '🎂';
                numRow.appendChild(cake);
            }

            cell.appendChild(numRow);

            if (entries?.length > 0) {
                const wrap = document.createElement('div');
                wrap.className = 'cal-day-photos';
                entries.slice(0, 2).forEach(({ place, visitIdx }) => {
                    const visit = place.visits[visitIdx];
                    const firstPhoto = (visit.photos || []).find(p => p?.src);
                    if (firstPhoto) {
                        const thumb = document.createElement('div');
                        thumb.className = 'cal-day-thumb';
                        const img = document.createElement('img');
                        img.src = firstPhoto.src; img.alt = place.name; img.loading = 'lazy';
                        thumb.appendChild(img);
                        wrap.appendChild(thumb);
                    } else {
                        const pill = document.createElement('div');
                        pill.className = 'cal-day-place-pill';
                        // cake replaces icon in pill slot when birthday + no photo
                        pill.textContent = (birthday ? '🎂 ' : place.icon + ' ') + place.name;
                        wrap.appendChild(pill);
                    }
                });
                if (entries.length > 2) {
                    const more = document.createElement('div');
                    more.className = 'cal-day-more';
                    more.textContent = '+' + (entries.length - 2) + ' more';
                    wrap.appendChild(more);
                }
                cell.appendChild(wrap);
                cell.addEventListener('click', () => {
                    const { place, visitIdx } = entries[0];
                    openMapPopup(place, visitIdx);
                });
            } else if (birthday) {
                // No check-in but it's a birthday — show cake in the content area
                const cakeBlock = document.createElement('div');
                cakeBlock.className = 'cal-birthday-solo';
                cakeBlock.textContent = '🎂';
                cell.appendChild(cakeBlock);
            }

            grid.appendChild(cell);
        }

        // Init calendar to latest data month
        (function () {
            const dates = Object.keys(dateVisitMap).sort();
            if (dates.length > 0) {
                const d = new Date(dates[dates.length - 1] + 'T00:00:00');
                calYear = d.getFullYear();
                calMonth = d.getMonth();
            }
        })();

        // ===== HANOI MAP =====
        const map = L.map('hanoi-map', { center: [21.0340, 105.8480], zoom: 14 });
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);
        setTimeout(() => map.invalidateSize(), 300);

        mapPlaces.forEach(place => {
            const icon = L.divIcon({
                html: `<div class="custom-pin"><div class="custom-pin-inner">${place.icon}</div></div>`,
                className: '', iconSize: [38, 38], iconAnchor: [19, 38], popupAnchor: [0, -42]
            });
            const marker = L.marker([place.lat, place.lng], { icon }).addTo(map);
            marker.on('click', () => openMapPopup(place));
            marker.bindTooltip(`<b>${place.name}</b>`, { direction: 'top', offset: [0, -42] });
        });

        heartPlaces.forEach(place => {
            const icon = L.divIcon({
                html: `<div class="heart-pin"><svg xmlns="http://www.w3.org/2000/svg" width="48" height="44" viewBox="0 0 48 44"><path d="M24 40 C24 40 4 26 4 14 C4 7.4 9.4 2 16 2 C19.8 2 23.2 3.8 24 6 C24.8 3.8 28.2 2 32 2 C38.6 2 44 7.4 44 14 C44 26 24 40 24 40Z" fill="#e8455a" stroke="#fff" stroke-width="2.5"/></svg></div>`,
                className: '', iconSize: [48, 44], iconAnchor: [24, 40], popupAnchor: [0, -44]
            });
            const marker = L.marker([place.lat, place.lng], { icon }).addTo(map);
            marker.bindTooltip(`<b>💕 ${place.name}</b>`, { direction: 'top', offset: [0, -28] });
        });

        // ===== POPUP =====
        function openMapPopup(place, startVisitIdx = 0) {
            document.getElementById('mapPopupIcon').textContent = place.icon;
            document.getElementById('mapPopupName').textContent = place.name;
            document.getElementById('mapPopupDesc').textContent = place.desc;
            document.getElementById('mapPopup').classList.add('open');
            renderVisitTabs(place, startVisitIdx);
        }

        function renderVisitTabs(place, activeIdx) {
            const body = document.getElementById('mapPopupBody');
            body.innerHTML = '';

            if (place.visits.length === 0) {
                body.innerHTML = `<div class="visit-empty-state"><div class="empty-icon">🗓️</div><div>No visits yet</div></div>`;
                return;
            }

            const tabBar = document.createElement('div');
            tabBar.className = 'visit-tab-bar';
            place.visits.forEach((visit, i) => {
                const tab = document.createElement('button');
                tab.className = 'visit-tab' + (i === activeIdx ? ' active' : '');
                const dateLabel = visit.date
                    ? new Date(visit.date + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })
                    : 'Visit ' + (i + 1);
                tab.textContent = 'Visit ' + (i + 1) + ' · ' + dateLabel;
                tab.onclick = () => renderVisitTabs(place, i);
                tabBar.appendChild(tab);
            });
            body.appendChild(tabBar);

            const visit = place.visits[activeIdx];
            const realPhotos = visit ? (visit.photos || []).filter(p => p?.src) : [];
            const realVideos = visit ? (visit.videos || []).filter(v => v?.src) : [];

            // Photos
            const photoLabel = document.createElement('div');
            photoLabel.className = 'media-section-label';
            photoLabel.innerHTML = '📷 Photos';
            body.appendChild(photoLabel);

            const photoGrid = document.createElement('div');
            photoGrid.className = 'map-photo-grid';
            if (realPhotos.length > 0) {
                realPhotos.forEach(photo => {
                    const item = document.createElement('div');
                    item.className = 'map-photo-item';
                    const img = document.createElement('img');
                    img.src = photo.src; img.alt = photo.caption || place.name; img.loading = 'lazy';
                    img.onclick = () => {
                        document.getElementById('mapViewerImg').src = photo.src;
                        document.getElementById('mapViewer').classList.add('open');
                    };
                    item.appendChild(img);
                    photoGrid.appendChild(item);
                });
            } else {
                const ph = document.createElement('div');
                ph.className = 'map-photo-item';
                ph.innerHTML = `<div class="map-photo-placeholder"><div class="ph-icon">📷</div><div>No photos yet</div><code>images/yourphoto.jpg</code></div>`;
                photoGrid.appendChild(ph);
            }
            body.appendChild(photoGrid);

            // Videos
            const videoLabel = document.createElement('div');
            videoLabel.className = 'media-section-label';
            videoLabel.innerHTML = '🎬 Videos';
            body.appendChild(videoLabel);

            const videoGrid = document.createElement('div');
            videoGrid.className = 'map-video-grid';
            if (realVideos.length > 0) {
                realVideos.forEach(vid => {
                    const item = document.createElement('div');
                    item.className = 'map-video-item';
                    const video = document.createElement('video');
                    video.src = vid.src;
                    video.controls = true;
                    video.preload = 'metadata';
                    video.setAttribute('playsinline', '');
                    if (vid.caption) video.title = vid.caption;
                    item.appendChild(video);
                    videoGrid.appendChild(item);
                });
            } else {
                const ph = document.createElement('div');
                ph.className = 'map-video-item';
                ph.style.cssText = 'background:var(--soft);border-radius:12px;padding:24px;text-align:center;';
                ph.innerHTML = `<div style="font-size:2rem;margin-bottom:8px;">🎬</div><div style="font-size:0.78rem;color:var(--muted);">No videos yet</div><code style="background:#f3e8e0;padding:2px 7px;border-radius:5px;font-size:0.72rem;color:var(--accent);">videos/yourvideo.mp4</code>`;
                videoGrid.appendChild(ph);
            }
            body.appendChild(videoGrid);
        }

        function closeMapPopup() {
            document.querySelectorAll('#mapPopupBody video').forEach(v => v.pause());
            document.getElementById('mapPopup').classList.remove('open');
        }

        document.getElementById('mapPopup').addEventListener('click', function (e) { if (e.target === this) closeMapPopup(); });
        document.getElementById('mapViewer').addEventListener('click', function (e) { if (e.target === this) this.classList.remove('open'); });
    </script>
</body>

</html>
